<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务管理系统 - Task Manager</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>任务管理</h1>
                <p class="subtitle">Task Manager System</p>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" data-section="dashboard">
                    <span class="icon">📊</span>
                    <span>仪表盘</span>
                </a>
                <a href="#" class="nav-item" data-section="users">
                    <span class="icon">👥</span>
                    <span>用户管理</span>
                </a>
                <a href="#" class="nav-item" data-section="projects">
                    <span class="icon">📁</span>
                    <span>项目管理</span>
                </a>
                <a href="#" class="nav-item" data-section="tasks">
                    <span class="icon">✓</span>
                    <span>任务管理</span>
                </a>
                <a href="#" class="nav-item" data-section="notifications">
                    <span class="icon">🔔</span>
                    <span>通知中心</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <span class="user-name">系统管理员</span>
                    <span class="user-role">Admin</span>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Header -->
            <header class="content-header">
                <div class="header-title">
                    <h2 id="sectionTitle">仪表盘</h2>
                    <p id="sectionDescription">系统概览和统计信息</p>
                </div>
                <div class="header-actions">
                    <button class="btn btn-secondary" onclick="refreshData()">
                        <span>🔄</span> 刷新
                    </button>
                    <button class="btn btn-primary" onclick="showCreateModal()">
                        <span>➕</span> 新建
                    </button>
                </div>
            </header>

            <!-- Content Sections -->
            <div class="content-body">
                <!-- Dashboard Section -->
                <section id="dashboardSection" class="section active">
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-icon">👥</div>
                            <div class="stat-info">
                                <h3 id="totalUsers">0</h3>
                                <p>总用户数</p>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon">📁</div>
                            <div class="stat-info">
                                <h3 id="totalProjects">0</h3>
                                <p>总项目数</p>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon">✓</div>
                            <div class="stat-info">
                                <h3 id="totalTasks">0</h3>
                                <p>总任务数</p>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon">⏰</div>
                            <div class="stat-info">
                                <h3 id="overdueTasks">0</h3>
                                <p>逾期任务</p>
                            </div>
                        </div>
                    </div>

                    <div class="dashboard-grid">
                        <div class="dashboard-card">
                            <h3>最近任务</h3>
                            <div id="recentTasks" class="task-list"></div>
                        </div>
                        <div class="dashboard-card">
                            <h3>进行中的项目</h3>
                            <div id="activeProjects" class="project-list"></div>
                        </div>
                    </div>
                </section>

                <!-- Users Section -->
                <section id="usersSection" class="section">
                    <div class="table-container">
                        <table class="data-table" id="usersTable">
                            <thead>
                                <tr>
                                    <th>用户名</th>
                                    <th>邮箱</th>
                                    <th>角色</th>
                                    <th>创建时间</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="usersTableBody"></tbody>
                        </table>
                    </div>
                </section>

                <!-- Projects Section -->
                <section id="projectsSection" class="section">
                    <div class="table-container">
                        <table class="data-table" id="projectsTable">
                            <thead>
                                <tr>
                                    <th>项目名称</th>
                                    <th>负责人</th>
                                    <th>状态</th>
                                    <th>优先级</th>
                                    <th>任务数</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="projectsTableBody"></tbody>
                        </table>
                    </div>
                </section>

                <!-- Tasks Section -->
                <section id="tasksSection" class="section">
                    <div class="filters-bar">
                        <select id="taskStatusFilter" onchange="loadTasks()">
                            <option value="">所有状态</option>
                            <option value="pending">待处理</option>
                            <option value="in_progress">进行中</option>
                            <option value="completed">已完成</option>
                            <option value="cancelled">已取消</option>
                        </select>
                        <select id="taskPriorityFilter" onchange="loadTasks()">
                            <option value="">所有优先级</option>
                            <option value="low">低</option>
                            <option value="medium">中</option>
                            <option value="high">高</option>
                            <option value="urgent">紧急</option>
                        </select>
                        <input type="text" id="taskSearch" placeholder="搜索任务..." onkeyup="searchTasks(event)">
                    </div>
                    <div class="table-container">
                        <table class="data-table" id="tasksTable">
                            <thead>
                                <tr>
                                    <th>任务标题</th>
                                    <th>项目</th>
                                    <th>负责人</th>
                                    <th>状态</th>
                                    <th>优先级</th>
                                    <th>截止日期</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="tasksTableBody"></tbody>
                        </table>
                    </div>
                </section>

                <!-- Notifications Section -->
                <section id="notificationsSection" class="section">
                    <div class="notification-controls">
                        <button class="btn btn-secondary" onclick="markAllNotificationsRead()">全部标记为已读</button>
                    </div>
                    <div class="notifications-list" id="notificationsList"></div>
                </section>
            </div>
        </main>
    </div>

    <!-- Modal Overlay -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 id="modalTitle">新建</h3>
                <button class="modal-close" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer" id="modalFooter"></div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Loading Spinner -->
    <div class="loading-spinner" id="loadingSpinner">
        <div class="spinner"></div>
        <p>加载中...</p>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
